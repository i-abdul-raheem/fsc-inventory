<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 112" fill="none" role="img" aria-labelledby="fwd-title fwd-desc">
  <title id="fwd-title">Feasible Solutions Contracting Est.</title>
  <desc id="fwd-desc">
    Logo mark with bilingual company name  intended for dark backgrounds (light text).
  </desc>
  <defs>
    <filter id="fwd-softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(8 14) scale(0.855)">
    <g transform="translate(48 48)" stroke-linecap="round" stroke-linejoin="round">
      <g transform="rotate(235)">
        <path d="M-29 10 Q 0 31 29 10" stroke="#8E7698" stroke-width="13" />
      </g>
      <g transform="rotate(353)">
        <path d="M-29 10 Q 0 31 29 10" stroke="#93A863" stroke-width="13" />
      </g>
      <g transform="rotate(117)">
        <path d="M-29 10 Q 0 31 29 10" stroke="#93B9B8" stroke-width="13" />
      </g>
    </g>
  </g>
  <text
    xml:lang="ar"
    direction="rtl"
    x="620"
    y="54"
    text-anchor="end"
    dominant-baseline="middle"
    fill="#fafafa"
    filter="url(#fwd-softGlow)"
    font-family="system-ui, 'Segoe UI', Tahoma, 'Noto Naskh Arabic', 'Arial Unicode MS', sans-serif"
    font-size="22"
    letter-spacing="-0.01em"
    >E$33) 'D-DHD 'DE,/J) DDEB'HD'*</text>
  <text
    x="118"
    y="92"
    text-anchor="start"
    dominant-baseline="middle"
    fill="#fafafa"
    filter="url(#fwd-softGlow)"
    font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="18"
    letter-spacing="0.01em"
    >Feasible Solutions Contracting Est.</text>
</svg>
